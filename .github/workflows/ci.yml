name: ci

# The Windows workflow only builds the desktop app, so nothing ever
# typechecked or tested the API in CI — its 100+ tests (auth, payments,
# pagination, retention) ran only on a developer machine, and a type error
# first surfaced during `pcmax deploy` on the VPS. This closes that gap.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build shared packages
        run: |
          npm run build -w @goh/validation --if-present
          npm run build -w @goh/types --if-present

      - name: Typecheck API
        run: npm run typecheck -w @goh/api

      # The integration suite starts its own Postgres via embedded-postgres,
      # so no service container is needed.
      - name: Test API
        run: npm run test -w @goh/api

  # winopt.rs edits the registry, services and scheduled tasks on a real user's
  # machine, and its 29 tests cover the rollback path — the one that has to work
  # when an apply fails halfway. The Windows workflow compiles this crate but
  # has never run those tests.
  tauri:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Tauri needs the system webkit/glib headers to build on Linux.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - name: Test Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build shared packages
        run: |
          npm run build -w @goh/validation --if-present
          npm run build -w @goh/types --if-present

      # `build` is `tsc --noEmit && vite build`, so this typechecks too — and
      # catches it on Linux in ~2 minutes instead of 20 minutes into the
      # Windows installer job.
      - name: Test and build desktop
        run: |
          npm run test -w @goh/desktop
          npm run build -w @goh/desktop
