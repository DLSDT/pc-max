name: ci

# The Windows workflow only builds the desktop app, so nothing ever
# typechecked or tested the API in CI — its 100+ tests (auth, payments,
# pagination, retention) ran only on a developer machine, and a type error
# first surfaced during `pcmax deploy` on the VPS. This closes that gap.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build shared packages
        run: |
          npm run build -w @goh/validation --if-present
          npm run build -w @goh/types --if-present

      - name: Typecheck API
        run: npm run typecheck -w @goh/api

      # The integration suite starts its own Postgres via embedded-postgres,
      # so no service container is needed.
      - name: Test API
        run: npm run test -w @goh/api

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build shared packages
        run: |
          npm run build -w @goh/validation --if-present
          npm run build -w @goh/types --if-present

      # `build` is `tsc --noEmit && vite build`, so this typechecks too — and
      # catches it on Linux in ~2 minutes instead of 20 minutes into the
      # Windows installer job.
      - name: Test and build desktop
        run: |
          npm run test -w @goh/desktop
          npm run build -w @goh/desktop
