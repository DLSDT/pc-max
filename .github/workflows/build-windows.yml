name: build-windows-installer

# Produces the standalone Windows installer (.exe) for PC MAX.
#
# Tauri's NSIS bundler must run on Windows, so the installer is built on a
# windows-latest runner and uploaded as a build artifact.
#
# Usage:
#   - Manual:  Actions → "build-windows-installer" → Run workflow
#   - Automatic: runs on every push to main/master
#   - The artifact download contains:
#       PC MAX_<version>_x64-setup.exe
#
# After downloading, publish the .exe wherever you distribute the app, and add
# a new App Release in the Admin panel so clients show "Update available".

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck + tests (API/Desktop)
        run: |
          npm run typecheck -w @goh/validation -w @goh/types
          npm test -w @goh/api
          npm test -w @goh/desktop

      - name: Rust tests (incl. Windows Optimizer engine)
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Build Windows installer (NSIS)
        # The installed app must talk to the deployed API, never localhost.
        # Configure the GitHub secret VITE_API_URL (e.g. https://api.pcmax.app/api/v1);
        # if it is unset we fall back to the production domain so a build never
        # silently bakes a development URL into the installer.
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.pcmax.app/api/v1' }}
        run: npm run tauri:build -w @goh/desktop

      - name: Inspect artifact identity
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/src-tauri/target/release -Filter '*.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'PC MAX.exe not found' }
          $v = (Get-Item $exe.FullName).VersionInfo
          Write-Host "File: $($exe.Name) | Product: $($v.ProductName) | Description: $($v.FileDescription) | Version: $($v.FileVersion)"
          if ($v.ProductName -ne 'PC MAX') { throw "ProductName mismatch: $($v.ProductName)" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcmax-windows-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
