name: build-windows-installer

# Produces the standalone Windows installer (.exe) for Game Optimization Hub.
#
# Tauri's NSIS bundler must run on Windows, so the installer is built on a
# windows-latest runner and uploaded as a build artifact.
#
# Usage:
#   - Manual:  Actions → "build-windows-installer" → Run workflow
#   - Automatic: runs on every push to main/master
#   - The artifact download contains:
#       Game Optimization Hub_<version>_x64-setup.exe
#
# After downloading, publish the .exe wherever you distribute the app, and add
# a new App Release in the Admin panel so clients show "Update available".

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install workspace dependencies
        run: npm ci

      - name: Build Windows installer (NSIS)
        run: npm run tauri:build -w @goh/desktop

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: goh-windows-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
