name: build-windows-installer

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build -w @goh/types --if-present
          npm run build -w @goh/validation --if-present

      - name: Run desktop tests
        run: npm run test -w @goh/desktop

      - name: Build Desktop Frontend
        run: npm run build -w @goh/desktop

      - name: Build Windows Installer (Tauri)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://pcmax-api.rixy.ir/api/v1' }}
          # Signing keys enable the auto-updater. Without them the build still
          # succeeds (unsigned) — it just cannot be served as an update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -w @goh/desktop

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcmax-windows-setup
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
