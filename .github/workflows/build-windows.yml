name: build-windows-installer

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable, MSVC)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install workspace dependencies
        run: npm ci

      - name: Build all workspace packages
        run: npm run build --workspaces --if-present

      - name: Build Windows installer (NSIS)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.pcmax.app/api/v1' }}
        run: npm run tauri:build -w @goh/desktop

      - name: Inspect artifact identity
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/src-tauri/target/release -Filter '*.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'PC MAX.exe not found' }
          $v = (Get-Item $exe.FullName).VersionInfo
          Write-Host "File: $($exe.Name) | Product: $($v.ProductName) | Description: $($v.FileDescription) | Version: $($v.FileVersion)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcmax-windows-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
