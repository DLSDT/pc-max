name: build-windows-installer

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-windows.yml'
    # A `v*` tag additionally publishes a release. Branch builds only produce an
    # artifact, and artifact downloads need a token — which the auto-updater
    # does not have. A release asset is fetchable anonymously, which is the
    # whole requirement for `downloadUrl`.
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    # Only needed to create the release below; the build itself reads nothing.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build -w @goh/types --if-present
          npm run build -w @goh/validation --if-present

      - name: Run desktop tests
        run: npm run test -w @goh/desktop

      - name: Build Desktop Frontend
        run: npm run build -w @goh/desktop

      - name: Build Windows Installer (Tauri)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://pc-maxapp.rixy.ir/api/v1' }}
          # Signing keys enable the auto-updater. Without them the build still
          # succeeds (unsigned) — it just cannot be served as an update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -w @goh/desktop

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcmax-windows-setup
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

      # Publish on a tag. The .sig must ship beside the installer: without it
      # the release cannot be registered as an update at all, since the server
      # treats an unsigned version as "no update available".
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd apps/desktop/src-tauri/target/release/bundle/nsis
          # Fail loudly rather than publishing a release with nothing attached.
          ls *.exe >/dev/null
          ls *.sig >/dev/null
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "PC MAX ${GITHUB_REF_NAME#v}" \
            --notes "Windows installer for ${GITHUB_REF_NAME#v}. The .sig is the auto-updater signature." \
            *.exe *.sig
