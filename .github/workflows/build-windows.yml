name: build-windows-installer

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-windows.yml'
    # A `v*` tag additionally publishes a release. Branch builds only produce an
    # artifact, and artifact downloads need a token — which the auto-updater
    # does not have. A release asset is fetchable anonymously, which is the
    # whole requirement for `downloadUrl`.
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    # Only needed to create the release below; the build itself reads nothing.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build -w @goh/types --if-present
          npm run build -w @goh/validation --if-present

      - name: Run desktop tests
        run: npm run test -w @goh/desktop

      - name: Build Desktop Frontend
        run: npm run build -w @goh/desktop

      - name: Build Windows Installer (Tauri)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://pc-maxapp.rixy.ir/api/v1' }}
          # Signing keys enable the auto-updater. Without them the build still
          # succeeds (unsigned) — it just cannot be served as an update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -w @goh/desktop

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcmax-windows-setup
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

      # Publish on a tag. The .sig must ship beside the installer: without it
      # the release cannot be registered as an update at all, since the server
      # treats an unsigned version as "no update available".
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd apps/desktop/src-tauri/target/release/bundle/nsis
          # Fail loudly rather than publishing a release with nothing attached.
          ls *.exe >/dev/null
          ls *.sig >/dev/null
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "PC MAX ${GITHUB_REF_NAME#v}" \
            --notes "Windows installer for ${GITHUB_REF_NAME#v}. The .sig is the auto-updater signature." \
            *.exe *.sig

      # Register the release as the latest version, so the auto-updater starts
      # offering it. Without this a tag publishes an installer that no existing
      # install is ever told about — the gap that left 0.4.0 unregistered for a
      # day, looking shipped while every client saw "you are up to date".
      #
      # Skipped when PCMAX_ADMIN_PASSWORD is unset, so a fork (or a build made
      # before the secret exists) still publishes its release rather than
      # failing at the last step.
      - name: Register release with the update server
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          PCMAX_ADMIN_PASSWORD: ${{ secrets.PCMAX_ADMIN_PASSWORD }}
          PCMAX_ADMIN_EMAIL: ${{ secrets.PCMAX_ADMIN_EMAIL || 'admin@pcmax.rixy.ir' }}
          PCMAX_API_BASE: ${{ secrets.VITE_API_URL || 'https://pc-maxapp.rixy.ir/api/v1' }}
        run: |
          set -euo pipefail
          if [ -z "${PCMAX_ADMIN_PASSWORD}" ]; then
            # This used to `exit 0`, which is how 0.4.2 and 0.4.3 both shipped
            # as green builds while every installed client went on being told
            # 0.4.1 was the latest — the exact failure this step exists to
            # prevent, reproduced by the step itself. A skip that reports
            # success is indistinguishable from a success.
            #
            # A fork has no reason to hold this secret and should still publish
            # its own installer, so only the repo that owns the update server
            # treats the missing secret as a failure.
            if [ "${GITHUB_REPOSITORY}" = "DLSDT/pc-max" ]; then
              echo "::error::PCMAX_ADMIN_PASSWORD is not set, so ${GITHUB_REF_NAME} was published but never registered. No existing install will be offered it until someone registers it by hand."
              exit 1
            fi
            echo "::warning::PCMAX_ADMIN_PASSWORD is not set — release published, not registered."
            exit 0
          fi

          cd apps/desktop/src-tauri/target/release/bundle/nsis
          exe=$(ls *.exe | head -1)
          sig=$(ls *.sig | head -1)
          # GitHub substitutes dots for spaces in asset URLs, so the public name
          # is not the name on disk.
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${exe// /.}"

          # The asset is served by a CDN that can lag the API call that created
          # it. register-release verifies the URL byte-for-byte and would fail
          # on a 404 that is only a few seconds old, so wait for it to appear.
          for _ in $(seq 1 30); do
            if curl -sfL -o /dev/null -r 0-0 "$url"; then break; fi
            sleep 4
          done

          # Release notes are shown to the user in the update prompt, so they
          # come from the tag's own message — whoever cut the release already
          # wrote the one-line reason there. A lightweight tag has none, in
          # which case the field stays empty rather than saying "v0.4.1", which
          # tells the user nothing they cannot already see.
          notes=$(git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" | sed -e 's/[[:space:]]*$//' || true)
          [ -n "$notes" ] || notes=$(git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}" || true)

          node "${GITHUB_WORKSPACE}/apps/api/scripts/register-release.mjs" \
            --exe "$exe" --sig "$sig" --url "$url" \
            --base "$PCMAX_API_BASE" --admin-email "$PCMAX_ADMIN_EMAIL" \
            ${notes:+--notes "$notes"} \
            --apply
