[package]
name = "pc-max"
version = "0.3.0"
description = "PC MAX — premium Windows gaming optimization"
authors = ["PC MAX"]
edition = "2021"

# The library is used by both the desktop binary and (optionally) mobile targets.
[lib]
name = "pc_max_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"

# Auto-update (Phase 17): the updater plugin requires a signing keypair.
# Generate one with `npm run tauri signer generate -w @goh/desktop` and publish
# the PUBLIC key in tauri.conf.json -> plugins.updater.pubkey. Until then the
# plugin is registered but `check()` returns no updates (graceful no-op).

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
