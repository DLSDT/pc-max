[package]
name = "pc-max"
version = "0.4.1"
description = "PC MAX — premium Windows gaming optimization"
authors = ["PC MAX"]
edition = "2021"

# The library is used by both the desktop binary and (optionally) mobile targets.
[lib]
name = "pc_max_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
# Real .exe icon extraction for the "add a game by executable" flow — pure
# Rust PE resource parsing (icoextract_rs, MIT), decoded to PNG via `ico`
# (MIT, ~26M downloads). Deliberately NOT `windows-icons` or `win-icon-extractor`
# (AGPL-3.0 — unsafe for this closed-source app) or a fictional `exe-ico`.
icoextract_rs = "0.1"
ico = "0.3"

# Auto-update (Phase 17): the updater plugin requires a signing keypair.
# Generate one with `npm run tauri signer generate -w @goh/desktop` and publish
# the PUBLIC key in tauri.conf.json -> plugins.updater.pubkey. Until then the
# plugin is registered but `check()` returns no updates (graceful no-op).

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
